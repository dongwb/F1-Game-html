// ============================================================
// F1 Grand Prix — v2 双人/多人对战
// ============================================================

// ---------- canvas ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// Mouse tracking (for track selector hover)
let mouseX = -1, mouseY = -1;
canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouseX = e.clientX - r.left; mouseY = e.clientY - r.top; });
canvas.addEventListener('mouseleave', () => { mouseX = -1; mouseY = -1; });
canvas.addEventListener('click', e => {
  if (!showTrackSelector) return;
  const r = canvas.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const cols = TRACKS_PER_PAGE, cardW = 260, cardH = 270, gap = 30;
  const totalW = cols * cardW + (cols-1) * gap;
  const sx = (W - totalW) / 2, sy = (H - cardH) / 2;
  const totalPages = Math.ceil(TRACK_PREVIEWS.length / TRACKS_PER_PAGE);
  const offset = trackSelectorPage * TRACKS_PER_PAGE;

  // Check prev/next arrow clicks
  const arrSize = 50;
  const prevX = sx - arrSize - 10, prevY = sy + cardH/2 - arrSize/2;
  const nextX = sx + totalW + 10, nextY = sy + cardH/2 - arrSize/2;
  if (trackSelectorPage > 0 && cx >= prevX && cx <= prevX + arrSize && cy >= prevY && cy <= prevY + arrSize) {
    trackSelectorPage--;
    return;
  }
  if (trackSelectorPage < totalPages - 1 && cx >= nextX && cx <= nextX + arrSize && cy >= nextY && cy <= nextY + arrSize) {
    trackSelectorPage++;
    return;
  }

  for (let i = 0; i < cols && offset + i < TRACK_PREVIEWS.length; i++) {
    const x = sx + i * (cardW + gap), y = sy;
    if (cx >= x && cx <= x + cardW && cy >= y && cy <= y + cardH) {
      const trackIdx = offset + i;
      showTrackSelector = false;
      const td = TRACK_DATA[trackIdx];
      if (trackIdx !== currentTrackIdx) {
        currentTrackIdx = trackIdx;
        generateTrack(td);
        initPositions();
        race.phase = 'IDLE'; race.elapsedTime = 0; race.winner = null;
        race.lightsOn = 0; race.countTimer = 0; race.countStep = 0;
        document.getElementById('trackLabel').textContent = td.label;
        document.getElementById('btnTrack').textContent = '⚇ ' + td.label;
        const cars = getActiveCars();
        let mx = 0, my = 0;
        for (const c of cars) { mx += c.x; my += c.y; }
        mx /= cars.length; my /= cars.length;
        cam.x = mx - W / (2 * ZOOM); cam.y = my - H / (2 * ZOOM);
        currentZoom = ZOOM; smoothTargetZoom = ZOOM;
        if (gameSettings.mode === 'dual') { cam2.x = p2.x - W / (4 * ZOOM); cam2.y = p2.y - H / (2 * ZOOM); }
      }
      break;
    }
  }
});

// ---------- roundRect polyfill ----------
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function catmullRom(t, p0, p1, p2, p3) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}

// Precompute track preview data for the selector minimaps
const TRACK_PREVIEWS = TRACK_DATA.map(td => {
  const pts = [];
  const nWp = td.waypoints.length;
  for (let i = 0; i < nWp; i++) {
    const i0 = (i-1+nWp)%nWp, i1=i, i2=(i+1)%nWp, i3=(i+2)%nWp;
    for (let j = 0; j < 12; j++) {
      const t = j/12;
      pts.push({ x: catmullRom(t, td.waypoints[i0][0], td.waypoints[i1][0], td.waypoints[i2][0], td.waypoints[i3][0]), y: catmullRom(t, td.waypoints[i0][1], td.waypoints[i1][1], td.waypoints[i2][1], td.waypoints[i3][1]) });
    }
  }
  for (let i = 0; i < pts.length; i++) {
    const next = pts[(i+1)%pts.length];
    const dx = next.x - pts[i].x, dy = next.y - pts[i].y, len = Math.sqrt(dx*dx+dy*dy);
    if (len > 0.001) { pts[i].tx = dx/len; pts[i].ty = dy/len; pts[i].nx = pts[i].ty; pts[i].ny = -pts[i].tx; }
    else { pts[i].tx = 0; pts[i].ty = -1; pts[i].nx = -1; pts[i].ny = 0; }
  }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of pts) {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  const hw = 110;
  return { ...td, previewPts: pts, bounds: { minX: minX-hw, maxX: maxX+hw, minY: minY-hw, maxY: maxY+hw } };
});

// ============================================================
// TRACK GENERATION — build track from TRACK_DATA
// ============================================================
function generateTrack(trackData) {
  // Step 1: Replace waypoints
  waypoints = trackData.waypoints.slice();

  // Step 2: Rebuild track array
  const nWp = waypoints.length;
  const newTrack = [];
  for (let i = 0; i < nWp; i++) {
    const i0 = (i - 1 + nWp) % nWp, i1 = i, i2 = (i + 1) % nWp, i3 = (i + 2) % nWp;
    for (let j = 0; j < SEG; j++) {
      const t = j / SEG;
      newTrack.push({
        x: catmullRom(t, waypoints[i0][0], waypoints[i1][0], waypoints[i2][0], waypoints[i3][0]),
        y: catmullRom(t, waypoints[i0][1], waypoints[i1][1], waypoints[i2][1], waypoints[i3][1]),
      });
    }
  }
  track = newTrack;

  // Step 3: Compute segment lengths, tangents, normals
  totalLen = 0;
  for (let i = 0; i < track.length; i++) {
    const p = track[i], next = track[(i + 1) % track.length];
    const dx = next.x - p.x, dy = next.y - p.y, len = Math.sqrt(dx * dx + dy * dy);
    if (len > 0.001) { p.tx = dx / len; p.ty = dy / len; p.nx = p.ty; p.ny = -p.tx; }
    else { p.tx = p.ty = p.nx = p.ny = 0; }
    p.dist = totalLen; totalLen += len;
  }
  track.forEach(p => p.totalLen = totalLen);

  // Step 4: Compute start/finish grid constants
  startIdx = trackData.startWp * SEG;
  finishIdx = trackData.finishWp * SEG;
  stHeading = Math.atan2(track[startIdx].tx, -track[startIdx].ty);
  stX = track[startIdx].x; stY = track[startIdx].y;
  stNX = track[startIdx].nx * 28; stNY = track[startIdx].ny * 28;
  stBX = -Math.sin(stHeading) * 126; stBY = Math.cos(stHeading) * 126;

  // Step 5: Recompute racing line and speed profile
  racingLine = [];
  speedProfile = [];
  computeRacingLineAndProfile();

  // Step 6: Recompute track bounds for minimap
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of track) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  const pad = CFG.trackWidth;
  trackBounds = { minX: minX - pad, maxX: maxX + pad, minY: minY - pad, maxY: maxY + pad };

  // Step 7: Regenerate grass blades
  grassBlades = [];
  for (let i = 0; i < 4000; i++) {
    grassBlades.push({ x: (Math.random() - 0.5) * 16000, y: (Math.random() - 0.5) * 12000, r: Math.random() * 3 + 1 });
  }
}

// ---------- tire marks ----------
const tireMarks = [];
const MAX_MARKS = 2500;
function addTireMark(x, y) { if (tireMarks.length >= MAX_MARKS) tireMarks.shift(); tireMarks.push({ x, y, a: 0.5 }); }

// ---------- brake marks (fade over 5 seconds) ----------
const brakeMarks = [];
const BRAKE_DURATION = 5;
const MAX_BRAKE_MARKS = 3000;
function addBrakeMark(x, y) {
  if (brakeMarks.length >= MAX_BRAKE_MARKS) brakeMarks.shift();
  brakeMarks.push({ x, y, life: BRAKE_DURATION });
}
function updateBrakeMarks(dt) {
  for (let i = brakeMarks.length - 1; i >= 0; i--) {
    brakeMarks[i].life -= dt;
    if (brakeMarks[i].life <= 0) brakeMarks.splice(i, 1);
  }
}
function drawBrakeMarks() {
  ctx.fillStyle = '#1a1a1a';
  for (const m of brakeMarks) {
    const a = Math.min(1, m.life / (BRAKE_DURATION * 0.4));
    ctx.globalAlpha = a * 0.55;
    ctx.beginPath(); ctx.arc(m.x, m.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function emitSparks(x, y, count) {
  for (let i = 0; i < count; i++) {

function computeRacingLineAndProfile() {
  racingLine = [];
  speedProfile = [];
  const n = track.length;
  if (n === 0) return;
  const maxOff = CFG.trackWidth * 0.40;

  // Step 1: Menger curvature on centerline (over 3-point window for smoothness)
  const curv = new Float64Array(n);
  const cw = 5;
  for (let i = 0; i < n; i++) {
    const p1 = track[(i - cw + n) % n], p2 = track[i], p3 = track[(i + cw) % n];
    const a = Math.sqrt((p2.x-p1.x)**2 + (p2.y-p1.y)**2);
    const b = Math.sqrt((p3.x-p2.x)**2 + (p3.y-p2.y)**2);
    const c = Math.sqrt((p3.x-p1.x)**2 + (p3.y-p1.y)**2);
    if (a * b * c < 0.001) { curv[i] = 0; continue; }
    const s = (a + b + c) / 2;
    const area = Math.sqrt(Math.max(0, s*(s-a)*(s-b)*(s-c)));
    curv[i] = 4 * area / (a * b * c);
    const cross = (p2.x-p1.x)*(p3.y-p2.y) - (p2.y-p1.y)*(p3.x-p2.x);
    if (cross < 0) curv[i] = -curv[i];
  }

  // Smooth curvature
  const sw = 8;
  for (let i = 0; i < n; i++) {
    let sum = 0, cnt = 0;
    for (let j = -sw; j <= sw; j++) { sum += curv[(i+j+n)%n]; cnt++; }
    curv[i] = cnt > 0 ? sum / cnt : 0;
  }

  // Step 2: Generate racing line by shifting inside
  for (let i = 0; i < n; i++) {
    const off = -Math.sign(curv[i]) * Math.min(Math.abs(curv[i]) * 8000, maxOff);
    racingLine.push({ x: track[i].x + track[i].nx * off, y: track[i].y + track[i].ny * off });
  }

  // Step 3: Gaussian smoothing with track-bound clamping (guarantees racing line stays on track)
  const gauss = [0.05, 0.25, 0.4, 0.25, 0.05];
  const clampDist = CFG.trackWidth * 0.42;
  for (let iter = 0; iter < 2; iter++) {
    const copy = racingLine.map(p => ({ x: p.x, y: p.y }));
    for (let i = 0; i < n; i++) {
      let sx = 0, sy = 0;
      for (let j = -2; j <= 2; j++) {
        const idx = (i + j + n) % n;
        sx += copy[idx].x * gauss[j+2]; sy += copy[idx].y * gauss[j+2];
      }
      // Clamp to stay within safe track bounds (prevents smoothing from pushing points off-track)
      const dx = sx - track[i].x, dy = sy - track[i].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > clampDist) {
        racingLine[i].x = track[i].x + (dx/dist) * clampDist;
        racingLine[i].y = track[i].y + (dy/dist) * clampDist;
      } else {
        racingLine[i].x = sx; racingLine[i].y = sy;
      }
    }
  }

  // Step 4: Compute racing line tangents and normals
  for (let i = 0; i < n; i++) {
    const next = racingLine[(i + 1) % n];
    const dx = next.x - racingLine[i].x, dy = next.y - racingLine[i].y;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0.001) { racingLine[i].tx = dx/len; racingLine[i].ty = dy/len; racingLine[i].nx = racingLine[i].ty; racingLine[i].ny = -racingLine[i].tx; }
    else { racingLine[i].tx = track[i].tx; racingLine[i].ty = track[i].ty; racingLine[i].nx = track[i].nx; racingLine[i].ny = track[i].ny; }
  }

  // Step 5: Speed profile on CENTERLINE using forward-backward min-time pass
  const latAccel = 500;

  // Curvature-limited max speed on centerline
  const vCurv = [];
  for (let i = 0; i < n; i++) {
    const c = Math.abs(curv[i]);
    vCurv.push(c > 0.00001 ? Math.min(Math.sqrt(latAccel / c), 660) : 660);
  }

  // Forward pass (acceleration-limited) using centerline segment lengths
  const vFwd = [vCurv[0]];
  for (let i = 1; i < n; i++) {
    const seg = Math.sqrt((track[i].x-track[i-1].x)**2 + (track[i].y-track[i-1].y)**2);
    const vAccel = Math.sqrt(vFwd[i-1]*vFwd[i-1] + 2 * CFG.accel * 1.3 * seg);
    vFwd.push(Math.min(vCurv[i], vAccel));
  }

  // Backward pass (braking-limited)
  const vBwd = new Array(n).fill(0);
  vBwd[n-1] = vFwd[n-1];
  for (let i = n - 2; i >= 0; i--) {
    const seg = Math.sqrt((track[i+1].x-track[i].x)**2 + (track[i+1].y-track[i].y)**2);
    const vBrake = Math.sqrt(vBwd[i+1]*vBwd[i+1] + 2 * CFG.brake * 1.0 * seg);
    vBwd[i] = Math.min(vFwd[i], vBrake);
  }

  // Smooth final profile
  for (let iter = 0; iter < 3; iter++) {
    for (let i = 1; i < n - 1; i++) vBwd[i] = (vBwd[i-1] + vBwd[i] + vBwd[i+1]) / 3;
    vBwd[0] = (vBwd[n-1] + vBwd[0] + vBwd[1]) / 3;
    vBwd[n-1] = (vBwd[n-2] + vBwd[n-1] + vBwd[0]) / 3;
  }
  speedProfile = vBwd;
}

function nearestTrackPoint(x, y) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < track.length; i += 3) { const dx = x - track[i].x, dy = y - track[i].y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  const s = Math.max(0, best - 4), e = Math.min(track.length, best + 5);
  for (let i = s; i < e; i++) { const dx = x - track[i].x, dy = y - track[i].y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  return { idx: best, dist: Math.sqrt(bd), point: track[best] };
}
function isOnTrack(x, y) { return nearestTrackPoint(x, y).dist < CFG.trackWidth * 0.55; }

function getCarProgress(car) {
  const n = nearestTrackPoint(car.x, car.y);
  return car.lapCount * totalLen + n.point.dist;
}

// ============================================================
// PLAYER UPDATE
// ============================================================
function updatePlayer(car, dt) {
  if (race.phase === 'FINISHED') return;
  dt = Math.min(dt, 0.05);
  const keyState = car === p1 ? window.__k1 : window.__k2;
  const km = car.keys;
  const sr = Math.abs(car.speed) / CFG.maxSpeed;

  if (!car.blocked) {
    if (keyState[km.up]) {
      if (car.speed < 0) car.speed += CFG.brake * dt;
      else {
        const drsBoostAmt = car.drsActive ? DRS_BOOST : 0;
        car.speed = Math.min(car.speed + CFG.accel * dt, 400 + (car.slipStreamBoost || 0) + drsBoostAmt);
      }
    }
    if (keyState[km.down] || keyState[' ']) {
      if (car.speed > 0) car.speed = Math.max(car.speed - CFG.brake * dt, 0);
      else car.speed -= CFG.accel * 0.4 * dt;
    }
  }

  // === DRS ===
  if (!car.blocked && race.phase === 'RACING') {
    // Cooldown decay
    if (car.drsCooldown > 0) { car.drsCooldown -= dt; if (car.drsCooldown < 0) car.drsCooldown = 0; }
    // Active timer
    if (car.drsActive) {
      car.drsTimer -= dt;
      if (car.drsTimer <= 0) { car.drsActive = false; car.drsTimer = 0; }
    }
    // DRS activation: key pressed + on straight + cooldown done + not already active
    if (keyState[km.drs]) {
      const n = nearestTrackPoint(car.x, car.y);
      if (speedProfile[n.idx] > DRS_STRAIGHT_THRESHOLD && car.drsCooldown <= 0 && !car.drsActive) {
        car.drsActive = true;
        car.drsTimer = DRS_DURATION;
        car.drsCooldown = car.lastLapClean ? DRS_COOLDOWN_CLEAN : DRS_COOLDOWN;
      }
    }
  }

  // Drag
  if (car.speed > 0) { car.speed -= CFG.drag * sr * dt; if (car.speed < 0) car.speed = 0; }
  else if (car.speed < 0) { car.speed += CFG.drag * 0.3 * dt; if (car.speed > 0) car.speed = 0; }

  // Steering (works even when blocked, like v1)
  const turn = CFG.turnLow + (CFG.turnHigh - CFG.turnLow) * Math.min(sr, 1);
  if (keyState[km.left]) car.heading -= turn * dt;
  if (keyState[km.right]) car.heading += turn * dt;

  // Off-track
  car.onTrack = isOnTrack(car.x, car.y);
  if (!car.onTrack) { car.speed -= CFG.offTrackDrag * dt; if (car.speed < 0) car.speed = 0; }

  // Brake lights
  car.braking = keyState[km.down] && car.speed > 30 && car.onTrack;

  // Tire marks (player1 only)
  if (car === p1 && ((keyState[km.down] && car.speed > 80) || ((keyState[km.left] || keyState[km.right]) && car.speed > 120)))
    addTireMark(car.x, car.y);

  // Move
  car.x += Math.sin(car.heading) * car.speed * dt;
  car.y -= Math.cos(car.heading) * car.speed * dt;

  // Lap cooldown decay
  if (car.lapCooldown > 0) car.lapCooldown -= dt;
}

// ============================================================
// AI UPDATE
// ============================================================
function updateAI(car, dt) {
  if (car.blocked || race.phase === 'FINISHED') return;
  dt = Math.min(dt, 0.05);
  const diff = currentDifficulty;
  const n = nearestTrackPoint(car.x, car.y);

  // === Track position tracking ===
  let idxDiff = n.idx - car.trackIdx;
  if (idxDiff < -track.length / 2) idxDiff += track.length;
  if (idxDiff > track.length / 2) idxDiff -= track.length;
  if (Math.abs(idxDiff) < track.length / 3) {
    car.trackIdx = n.idx;
  }

  // === Off-track: coast, main loop handles 1s respawn ===
  car.onTrack = n.dist <= CFG.trackWidth * 0.55;
  if (!car.onTrack) {
    car.speed -= CFG.offTrackDrag * dt;
    if (car.speed < 0) car.speed = 0;
  }

  // === Pure Pursuit on track centerline (no extra sway strategies) ===
  const avgSegLen = totalLen / track.length;
  const lookaheadDist = Math.min(Math.max(car.speed * 2.0, 100), 500);
  const lookSteps = Math.min(Math.floor(lookaheadDist / avgSegLen), track.length * 0.35);
  const tIdx = (car.trackIdx + lookSteps) % track.length;
  const target = track[tIdx];

  // Steer toward target
  const dx = target.x - car.x, dy = target.y - car.y;
  const targetAngle = Math.atan2(dx, -dy);
  let headingErr = targetAngle - car.heading;
  while (headingErr > Math.PI) headingErr -= 2 * Math.PI;
  while (headingErr < -Math.PI) headingErr += 2 * Math.PI;

  // Smooth steering: proportional to error, capped rate, frame-rate independent
  const maxSteerRate = 4.0;
  const steerGain = 2.5;
  const steerCmd = Math.sign(headingErr) * Math.min(Math.abs(headingErr) * steerGain, maxSteerRate);
  car.heading += steerCmd * dt;

  // === AI vs AI avoidance: nudge away from nearby cars ===
  for (const other of getActiveCars()) {
    if (other === car || other.blocked) continue;
    const adx = other.x - car.x, ady = other.y - car.y;
    const adist = Math.sqrt(adx * adx + ady * ady);
    if (adist < 65 && adist > 0.1) {
      const avoidAngle = Math.atan2(adx, -ady);
      let avoidErr = avoidAngle - car.heading;
      while (avoidErr > Math.PI) avoidErr -= 2 * Math.PI;
      while (avoidErr < -Math.PI) avoidErr += 2 * Math.PI;
      car.heading -= Math.sign(avoidErr) * (1 - adist / 65) * 2.0 * dt;
    }
  }

  // === Speed control using centerline speed profile ===
  if (car.onTrack) {
    car.braking = false;
    const drsBoostAmt = car.drsActive ? DRS_BOOST : 0;
    const diffMax = Math.min(CFG.maxSpeed * diff.speedMult, 600 + (car.slipStreamBoost || 0) + drsBoostAmt);
    const scanAheadSteps = 10 + Math.min(Math.floor(car.speed * 3.0 / avgSegLen), track.length * 0.30);
    let minProfileSpd = Infinity;
    for (let i = 5; i < scanAheadSteps; i += 3) {
      const idx = (car.trackIdx + i) % speedProfile.length;
      if (speedProfile[idx] < minProfileSpd) minProfileSpd = speedProfile[idx];
    }
    const cornerLimit = minProfileSpd * (diff.cornerSpeed / 0.78);
    const targetSpeed = Math.min(diffMax, cornerLimit);
    const spdErr = targetSpeed - car.speed;
    if (Math.abs(spdErr) > 3) {
      if (spdErr < 0) {
        const decel = Math.min(-spdErr * 2.0, CFG.brake);
        car.speed = Math.max(car.speed - decel * dt, targetSpeed);
        car.braking = true;
      } else if (car.speed < diffMax) {
        car.speed = Math.min(car.speed + CFG.accel * diff.accelFactor * dt, targetSpeed);
      }
    }
    if (!car.braking) car.braking = car.speed < car.prevSpeed - 8 && car.speed > 30;
    car.prevSpeed = car.speed;
    car.speed -= CFG.drag * (car.speed / CFG.maxSpeed) * dt;
    if (car.speed < 0) car.speed = 0;
    if (car.speed > diffMax) car.speed = diffMax;

    // === DRS for AI ===
    if (car.drsCooldown > 0) { car.drsCooldown -= dt; if (car.drsCooldown < 0) car.drsCooldown = 0; }
    if (car.drsActive) {
      car.drsTimer -= dt;
      if (car.drsTimer <= 0) { car.drsActive = false; car.drsTimer = 0; }
    }
    if (speedProfile[car.trackIdx] > DRS_STRAIGHT_THRESHOLD && car.drsCooldown <= 0 && !car.drsActive && car.speed > 300) {
      car.drsActive = true;
      car.drsTimer = DRS_DURATION;
      car.drsCooldown = car.lastLapClean ? DRS_COOLDOWN_CLEAN : DRS_COOLDOWN;
    }
  } else {
    car.braking = true;
    car.prevSpeed = car.speed;
  }

  // Position update
  car.x += Math.sin(car.heading) * car.speed * dt;
  car.y -= Math.cos(car.heading) * car.speed * dt;
}
function checkCollisions() {
  const cars = getActiveCars();
  for (let i = 0; i < cars.length; i++) {
    for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
      // Skip AI-AI collisions
      if ((a === a1 || a === a2) && (b === a1 || b === a2)) continue;
      const dx = a.x - b.x, dy = a.y - b.y, dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 38 && dist > 0.01) {
        const nx = dx / dist, ny = dy / dist, overlap = (38 - dist) * 0.6;
        a.x += nx * overlap; a.y += ny * overlap;
        b.x -= nx * overlap; b.y -= ny * overlap;
        const relV = (a.speed - b.speed) * 0.12;
        a.speed -= relV; if (a.speed < 0) a.speed = 0;
        b.speed += relV * 0.6; if (b.speed < 0) b.speed = 0;
        emitSparks((a.x + b.x) / 2, (a.y + b.y) / 2, 12);
        a.hadCollision = true;
        b.hadCollision = true;
      }
    }
  }
}

  race.elapsedTime = 0; race.winner = null;

  else {
    const cars = getActiveCars();
    let mx = 0, my = 0;
    for (const c of cars) { mx += c.x; my += c.y; }
    mx /= cars.length; my /= cars.length;
    cam.x = mx - W/(2*ZOOM); cam.y = my - H/(2*ZOOM); currentZoom = ZOOM;
  }
  cam2.x = p2.x - W/(4*ZOOM); cam2.y = p2.y - H/(2*ZOOM);
}

function updateCountdown(dt) {
  if (race.phase !== 'COUNTDOWN') return;
  race.countTimer += dt;

  if (race.countStep < 5) {
    if (race.countTimer >= 0.6) { race.countStep++; race.lightsOn = race.countStep; race.countTimer = 0; }
  } else if (race.countStep === 5) {
    if (race.countTimer >= 1.2) {
      race.countStep = 6; race.lightsOn = 0;
      race.phase = 'RACING';
      for (const c of getActiveCars()) c.blocked = false;
      race.countTimer = 0;
      // Reset lap timers
      for (const c of getActiveCars()) c.lapStartTime = 0;
    }
  }
}

function drawCar(x, y, heading, c, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(heading);

  ctx.shadowColor = '#000'; ctx.shadowBlur = 5;

  ctx.fillStyle = c.color;
  ctx.fillRect(-26*s,34*s,6*s,12*s); ctx.fillRect(20*s,34*s,6*s,12*s);

  ctx.beginPath();
  ctx.moveTo(0,-40*s); ctx.quadraticCurveTo(8*s,-38*s,14*s,-30*s);
  ctx.lineTo(10*s,-20*s); ctx.quadraticCurveTo(8*s,-14*s,7*s,-10*s);
  ctx.lineTo(12*s,4*s); ctx.quadraticCurveTo(18*s,14*s,18*s,24*s);
  ctx.lineTo(16*s,34*s); ctx.lineTo(12*s,40*s); ctx.lineTo(8*s,44*s);
  ctx.lineTo(-8*s,44*s); ctx.lineTo(-12*s,40*s); ctx.lineTo(-16*s,34*s);
  ctx.lineTo(-18*s,24*s); ctx.quadraticCurveTo(-18*s,14*s,-12*s,4*s);
  ctx.lineTo(-7*s,-10*s); ctx.quadraticCurveTo(-8*s,-14*s,-10*s,-20*s);
  ctx.lineTo(-14*s,-30*s); ctx.quadraticCurveTo(-8*s,-38*s,0,-40*s);
  ctx.closePath(); ctx.fill();

  // Front wing
  ctx.fillStyle = c.accent;
  ctx.beginPath(); ctx.moveTo(-24*s,-36*s); ctx.lineTo(-22*s,-34*s); ctx.lineTo(-15*s,-34*s); ctx.lineTo(-12*s,-37*s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(24*s,-36*s); ctx.lineTo(22*s,-34*s); ctx.lineTo(15*s,-34*s); ctx.lineTo(12*s,-37*s); ctx.closePath(); ctx.fill();

  // Rear wing
  ctx.beginPath(); ctx.moveTo(-24*s,38*s); ctx.lineTo(-26*s,44*s); ctx.lineTo(-4*s,44*s); ctx.lineTo(-4*s,40*s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(24*s,38*s); ctx.lineTo(26*s,44*s); ctx.lineTo(4*s,44*s); ctx.lineTo(4*s,40*s); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = c.accent; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-24*s,38*s); ctx.lineTo(24*s,38*s); ctx.stroke();

  // Center stripe
  ctx.strokeStyle = c.accent; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,-38*s); ctx.lineTo(0,40*s); ctx.stroke();

  // Halo
  ctx.strokeStyle = '#888'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0,-12*s,6*s,4*s,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.ellipse(0,-11*s,4.5*s,3*s,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = c.accent;
  ctx.beginPath(); ctx.arc(0,-11*s,2.5*s,0,Math.PI*2); ctx.fill();

  // Number
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(c.num, 0, 6*s);
  ctx.fillStyle = c.accent; ctx.fillRect(-1*s,-32*s,2*s,3*s);

  // Brake lights — red glow at rear when braking
  if (c.braking) {
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#ff2200';
    ctx.beginPath(); ctx.arc(-6*s, 40*s, 4*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6*s, 40*s, 4*s, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Wheels
  ctx.shadowBlur = 0; ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.ellipse(-16*s,-22*s,5*s,3*s,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16*s,-22*s,5*s,3*s,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-16*s,24*s,6*s,3.5*s,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16*s,24*s,6*s,3.5*s,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
  [[-16,-22,5,3],[16,-22,5,3],[-16,24,6,3.5],[16,24,6,3.5]].forEach(([rx,ry,rw,rh]) => {
    ctx.beginPath(); ctx.ellipse(rx*s,ry*s,rw*s*0.5,rh*s*0.5,0,0,Math.PI*2); ctx.stroke();
  });
  ctx.restore();
}

// ============================================================
// SPEED WAKE
// ============================================================
function drawWake(car) {
  if (car.speed <= 300) return;
  const intensity = Math.min(1, (car.speed - 300) / 150);
  const wakeLen = 30 + intensity * 50;
  const wakeW = 8 + intensity * 10;
  const cosH = Math.cos(car.heading), sinH = Math.sin(car.heading);
  // Rear of car body
  const rx = car.x - sinH * 42, ry = car.y + cosH * 42;
  // End of wake
  const ex = rx - sinH * wakeLen, ey = ry + cosH * wakeLen;
  const hw = wakeW / 2, fw = hw * 0.3;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(rx + cosH * hw, ry + sinH * hw);
  ctx.lineTo(rx - cosH * hw, ry - sinH * hw);
  ctx.lineTo(ex - cosH * fw, ey - sinH * fw);
  ctx.lineTo(ex + cosH * fw, ey + sinH * fw);
  ctx.closePath();
  const grad = ctx.createLinearGradient(rx, ry, ex, ey);
  grad.addColorStop(0, `rgba(180, 210, 255, ${0.25 * intensity})`);
  grad.addColorStop(1, 'rgba(180, 210, 255, 0)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();
}

function drawSlipstream(car) {
  if (!car.slipStreamBoost || car.slipStreamBoost <= 0 || car.speed < 200) return;
  const intensity = Math.min(1, car.slipstreamTimer / 1.5);
  const len = 40 + intensity * 60;
  const w = 6 + intensity * 12;
  const cosH = Math.cos(car.heading), sinH = Math.sin(car.heading);
  // Rear of car body
  const rx = car.x - sinH * 42, ry = car.y + cosH * 42;
  // End of wake
  const ex = rx - sinH * len, ey = ry + cosH * len;
  const hw = w / 2, fw = hw * 0.3;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(rx + cosH * hw, ry + sinH * hw);
  ctx.lineTo(rx - cosH * hw, ry - sinH * hw);
  ctx.lineTo(ex - cosH * fw, ey - sinH * fw);
  ctx.lineTo(ex + cosH * fw, ey + sinH * fw);
  ctx.closePath();
  const grad = ctx.createLinearGradient(rx, ry, ex, ey);
  grad.addColorStop(0, `rgba(100, 200, 255, ${0.35 * intensity})`);
  grad.addColorStop(1, 'rgba(100, 200, 255, 0)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Additional glow particles
  for (let i = 0; i < 4; i++) {
    const t = Math.random();
    const px = rx + (ex - rx) * t + (Math.random() - 0.5) * w;
    const py = ry + (ey - ry) * t + (Math.random() - 0.5) * w;
    ctx.beginPath();
    ctx.arc(px, py, 2 + Math.random() * 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(100, 200, 255, ${0.3 * intensity * (1 - t)})`;
    ctx.fill();
  }
  ctx.restore();
}

function drawDRS(car) {
  if (!car.drsActive) return;
  const intensity = Math.min(1, car.drsTimer / 1.5);
  const len = 20 + intensity * 40;
  const w = 4 + intensity * 10;
  const cosH = Math.cos(car.heading), sinH = Math.sin(car.heading);
  // Rear of car body
  const rx = car.x - sinH * 42, ry = car.y + cosH * 42;
  const ex = rx - sinH * len, ey = ry + cosH * len;
  const hw = w / 2, fw = hw * 0.3;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(rx + cosH * hw, ry + sinH * hw);
  ctx.lineTo(rx - cosH * hw, ry - sinH * hw);
  ctx.lineTo(ex - cosH * fw, ey - sinH * fw);
  ctx.lineTo(ex + cosH * fw, ey + sinH * fw);
  ctx.closePath();
  const grad = ctx.createLinearGradient(rx, ry, ex, ey);
  grad.addColorStop(0, `rgba(0, 220, 0, ${0.4 * intensity})`);
  grad.addColorStop(1, 'rgba(0, 220, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Green particles
  for (let i = 0; i < 3; i++) {
    const t = Math.random();
    const px = rx + (ex - rx) * t + (Math.random() - 0.5) * w;
    const py = ry + (ey - ry) * t + (Math.random() - 0.5) * w;
    ctx.beginPath();
    ctx.arc(px, py, 1.5 + Math.random() * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 220, 0, ${0.3 * intensity * (1 - t)})`;
    ctx.fill();
  }
  ctx.restore();
}

function drawTrack() {
  const hw = CFG.trackWidth / 2;

  // Track surface
  ctx.beginPath();
  for (let i = 0; i < track.length; i++) {
    const p = track[i];
    i === 0 ? ctx.moveTo(p.x + p.nx * hw, p.y + p.ny * hw) : ctx.lineTo(p.x + p.nx * hw, p.y + p.ny * hw);
  }
  const pL = track[track.length - 1];
  ctx.lineTo(pL.x - pL.nx * hw, pL.y - pL.ny * hw);
  for (let i = track.length - 1; i >= 0; i--) { const p = track[i]; ctx.lineTo(p.x - p.nx * hw, p.y - p.ny * hw); }
  ctx.closePath();
  ctx.fillStyle = '#3a3a3a'; ctx.fill();

  // Edge lines
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
  for (let side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    for (let i = 0; i < track.length; i++) { const p = track[i]; i === 0 ? ctx.moveTo(p.x + p.nx * hw * side, p.y + p.ny * hw * side) : ctx.lineTo(p.x + p.nx * hw * side, p.y + p.ny * hw * side); }
    ctx.closePath(); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Curbing
  const CURB_DEPTH = 26;
  const CURB_STRIPE = 3;
  for (let i = 0; i < track.length; i++) {
    const p = track[i], pn = track[(i + 1) % track.length];
    const p_1 = track[(i - 1 + track.length) % track.length];
    let a = Math.atan2(p.ty, p.tx) - Math.atan2(p_1.ty, p_1.tx);
    if (a > Math.PI) a -= 2 * Math.PI;
    if (a < -Math.PI) a += 2 * Math.PI;
    if (Math.abs(a) > 0.04) {
      const side = a > 0 ? 1 : -1;
      const red = Math.floor(i / CURB_STRIPE) % 2 === 0;
      ctx.fillStyle = red ? '#cc0000' : '#ffffff';
      ctx.beginPath();
      ctx.moveTo(p.x + p.nx * hw * side, p.y + p.ny * hw * side);
      ctx.lineTo(pn.x + pn.nx * hw * side, pn.y + pn.ny * hw * side);
      ctx.lineTo(pn.x + pn.nx * (hw - CURB_DEPTH) * side, pn.y + pn.ny * (hw - CURB_DEPTH) * side);
      ctx.lineTo(p.x + p.nx * (hw - CURB_DEPTH) * side, p.y + p.ny * (hw - CURB_DEPTH) * side);
      ctx.closePath(); ctx.fill();
    }
  }

  // Start/finish line (checkered)
  const sf = track[startIdx], sf2 = track[(startIdx + 1) % track.length];
  const sdx = sf2.x - sf.x, sdy = sf2.y - sf.y, sl = Math.sqrt(sdx*sdx + sdy*sdy) || 1;
  const snx = -sdy/sl * hw, sny = sdx/sl * hw;
  for (let j = -1; j <= 1; j++) for (let i = -6; i <= 6; i++) {
    const t = i / 12, cx = sf.x + snx * t * 2 + sdx/sl * j * 6, cy = sf.y + sny * t * 2 + sdy/sl * j * 6;
    ctx.fillStyle = (i + j) % 2 === 0 ? '#fff' : '#111';
    ctx.fillRect(cx - 3, cy - 3, 6, 6);
  }

  // Finish line with flag (ahead of grid)
  const ff = track[finishIdx], ff2 = track[(finishIdx + 1) % track.length];
  const fdx = ff2.x - ff.x, fdy = ff2.y - ff.y, fl = Math.sqrt(fdx*fdx + fdy*fdy) || 1;
  const fnx = -fdy/fl * hw, fny = fdx/fl * hw;
  // Checkered finish band across the track
  for (let j = -10; j <= 10; j++) for (let i = -3; i <= 3; i++) {
    const t = i / 6, cx = ff.x + fnx * t * 2 + fdx/fl * j * 3, cy = ff.y + fny * t * 2 + fdy/fl * j * 3;
    ctx.fillStyle = (i + j) % 2 === 0 ? '#fff' : '#111';
    ctx.fillRect(cx - 1.5, cy - 1.5, 3, 3);
  }
  // Finish line banner text
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
  ctx.save();
  ctx.translate(ff.x, ff.y);
  ctx.rotate(Math.atan2(fdy, fdx));
  ctx.fillText('终点', 0, -hw - 16);
  ctx.restore();

  // Flag pole at the side of the finish line
  const poleSide = 1;
  const px = ff.x + fnx * poleSide + fdx/fl * 8;
  const py = ff.y + fny * poleSide + fdy/fl * 8;
  // Pole (four segments)
  ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - 120); ctx.stroke();
  // Flag
  ctx.fillStyle = '#ff2200';
  ctx.beginPath(); ctx.moveTo(px, py - 120); ctx.lineTo(px + 50, py - 105); ctx.lineTo(px, py - 90); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px, py - 120); ctx.lineTo(px + 50, py - 105); ctx.lineTo(px, py - 90); ctx.closePath(); ctx.stroke();

  // Start grid — miniature cars
  const gL = 28, gGap = 126;
  const bx = -Math.sin(stHeading), by = Math.cos(stHeading);
  const gridPositions = [
    { x: stX - track[startIdx].nx * gL, y: stY - track[startIdx].ny * gL },
    { x: stX + track[startIdx].nx * gL, y: stY + track[startIdx].ny * gL },
    { x: stX - track[startIdx].nx * gL + bx * gGap, y: stY - track[startIdx].ny * gL + by * gGap },
    { x: stX + track[startIdx].nx * gL + bx * gGap, y: stY + track[startIdx].ny * gL + by * gGap },
  ];
  const activeCars = getActiveCars();
  for (let i = 0; i < activeCars.length; i++) {
    const gc = activeCars[i];
    const gp = gridPositions[i];
    drawCar(gp.x, gp.y, stHeading, gc, 0.45);
  }
}

function drawGrass() {
  const g = ctx.createRadialGradient(0, 2000, 50, 0, 2000, 7000);
  g.addColorStop(0, '#2d5a1e'); g.addColorStop(0.5, '#1f4f13'); g.addColorStop(1, '#14330a');
  ctx.fillStyle = g; ctx.fillRect(-7000, -5000, 14000, 14000);
  ctx.fillStyle = 'rgba(60,130,35,0.1)';
  for (const b of grassBlades) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); }
}

function drawTireMarks() {
  ctx.fillStyle = 'rgba(40,40,40,0.5)';
  for (const m of tireMarks) { ctx.globalAlpha = m.a; ctx.beginPath(); ctx.arc(m.x, m.y, 2, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
}

function drawSparksFx() {
  for (const s of sparks) {
    const a = Math.max(0, s.life / (s.maxLife || 0.5));
    ctx.fillStyle = `rgba(255,200,50,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, 1.5 + a*2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(255,100,0,${a*0.5})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, 3 + a*3, 0, Math.PI*2); ctx.fill();
  }
}

function drawSpeedLines(cx, cy, h, sp) {
  if (sp < 120) return;
  const int = Math.min((sp - 120) / 240, 1) * 0.18;
  ctx.strokeStyle = `rgba(255,255,255,${int})`; ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const a = h + (Math.random() - 0.5) * 0.5, l = 20 + Math.random() * 50 * (sp / CFG.maxSpeed);
    const so = (Math.random() - 0.5) * 40;
    const sx = cx + Math.sin(a + Math.PI/2) * so, sy = cy - Math.cos(a + Math.PI/2) * so;
    ctx.beginPath(); ctx.moveTo(sx - Math.sin(a)*l, sy + Math.cos(a)*l); ctx.lineTo(sx, sy); ctx.stroke();
  }
}

// ============================================================
// COUNTDOWN LIGHTS
// ============================================================
function drawCountdownLights() {
  if (race.phase !== 'COUNTDOWN') return;
  const cx = W/2, cy = H/2 - 60;
  const lw = 32, gap = 12, tw = 5*lw + 4*gap;

  roundRect(ctx, cx - tw/2 - 20, cy - 18, tw + 40, 56, 8); ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fill();
  roundRect(ctx, cx - tw/2 - 10, cy - 8, tw + 20, 36, 4); ctx.fillStyle = '#1a1a1a'; ctx.fill();

  for (let i = 0; i < 5; i++) {
    const lx = cx - tw/2 + i*(lw+gap) + lw/2;
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(lx, cy+10, lw/2-2, 0, Math.PI*2); ctx.fill();
    if (i < race.lightsOn) {
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 20;
      const g = ctx.createRadialGradient(lx, cy+10, 0, lx, cy+10, lw/2);
      g.addColorStop(0,'#ff4444'); g.addColorStop(0.6,'#cc0000'); g.addColorStop(1,'#880000');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(lx, cy+10, lw/2-2, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.fillStyle = '#888'; ctx.font = 'bold 12px "Courier New",monospace'; ctx.textAlign = 'center';
  ctx.fillText('倒计时', cx, cy - 32);
}

function fmtTime(t) {
  if (t <= 0) return '--:--.---';
  const m = Math.floor(t/60), s = Math.floor(t%60), ms = Math.floor((t - Math.floor(t))*1000);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`;
}
function fmtLap(t) {
  if (t <= 0) return '--:--.---';
  const s = Math.floor(t%60), ms = Math.floor((t - Math.floor(t))*1000);
  return `${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`;
}

function getCarLabel(car) {
  if (car === p1) return '玩家1';
  if (car === p2) return '玩家2';
  if (car === a1) return 'AI #44';
  if (car === a2) return 'AI #77';
  return '';
}

function drawCarPanel(x, y, w, h, car, accentColor, title) {
  if (!car) return;
  roundRect(ctx, x, y, w, h, 6); ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fill();
  ctx.fillStyle = accentColor; ctx.fillRect(x, y, 4, h);

  ctx.fillStyle = '#aaa'; ctx.font = '10px "Courier New",monospace'; ctx.textAlign = 'left';
  ctx.fillText(title || getCarLabel(car), x+14, y+16);

  const spd = Math.round(Math.abs(car.speed * 0.85));
  ctx.fillStyle = '#fff'; ctx.font = 'bold 24px "Courier New",monospace'; ctx.textAlign = 'left';
  ctx.fillText(spd.toString(), x+14, y+46);
  ctx.fillStyle = '#888'; ctx.font = '11px "Courier New",monospace'; ctx.textAlign = 'right';
  ctx.fillText('公里/时', x+w-16, y+46);

  ctx.fillStyle = '#eee'; ctx.font = 'bold 13px "Courier New",monospace'; ctx.textAlign = 'left';
  ctx.fillText(`圈 ${car.lapCount+1}/${raceLaps}`, x+14, y+74);
}

function drawHUD() {
  const px = 16, py = 16, pw = 210;

    ctx.fillStyle = '#888'; ctx.font = '11px "Courier New",monospace'; ctx.textAlign = 'right';

    ctx.textAlign = 'right';
    ctx.fillText(`圈 ${p1.lapCount+1}/${raceLaps}`, 142, 70);
    // p2 panel (right viewport area)

    ctx.fillStyle = p2.color; ctx.fillRect(W-158, 8, 4, 75);
    ctx.fillStyle = '#aaa'; ctx.font = '10px "Courier New",monospace'; ctx.textAlign = 'left';
    ctx.fillText('玩家2  ' + p2.num, W-148, 22);

  } else {

    const p1Rank = ranked.indexOf(p1) + 1;

    ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 18px "Courier New",monospace'; ctx.textAlign = 'left';
    if (gameSettings.mode === 'dual' || gameSettings.aiCount > 0) {

    ctx.fillStyle = '#888'; ctx.font = '10px "Courier New",monospace'; ctx.textAlign = 'center';
    ctx.fillText('速度', px+pw/2, py+135);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px "Courier New",monospace'; ctx.textAlign = 'right';
    ctx.fillText(ds.toString(), px+pw/2 - 6, py+158);
    ctx.fillStyle = '#888'; ctx.font = '12px "Courier New",monospace'; ctx.textAlign = 'left';

    // Gear & lap

    // ---- Right side panels ----

    ry = py;
    rpw = 162;

    // P2 panel

      drawCarPanel(rx, ry, rpw, 92, p2, p2.color, '玩家2  #01');
      ry += 100;
    }

    // AI panels
    if (gameSettings.aiCount >= 1) {
      drawCarPanel(rx, ry, rpw, 92, a1, a1.color, 'AI  #44');
      ry += 100;
    }
    if (gameSettings.aiCount >= 2) {
      if (ry + 92 > H - 40) { rx -= 170; ry = py; } // wrap to next column
      drawCarPanel(rx, ry, rpw, 92, a2, a2.color, 'AI  #77');
      ry += 100;
    }
  }

  // Bottom info bar
  const infoY = Math.max(ry, H - 200);
  // Difficulty indicator
  roundRect(ctx, W-120, infoY, 104, 26, 4); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fill();
  ctx.fillStyle = '#88ccff'; ctx.font = 'bold 11px "Courier New",monospace'; ctx.textAlign = 'center';
  ctx.fillText(`难度: ${currentDifficulty.label}`, W-68, infoY+18);

    // Slipstream boost indicator
  const slipCars = gameSettings.mode === 'dual' ? [p1, p2] : [p1];
  for (const sc of slipCars) {
    if (sc.slipStreamBoost > 0) {
      if (gameSettings.mode === 'dual' && dualSplit) {
        ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 10px "Courier New",monospace'; ctx.textAlign = 'center';
        ctx.fillText('[尾流]', sc === p1 ? 83 : W - 83, 88);
      } else if (sc === p1) {
        ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 10px "Courier New",monospace'; ctx.textAlign = 'center';
        ctx.fillText('[尾流]', 83, 88);
      }
    }
  }

  // ---- DRS status indicator ----
  const drsCars = gameSettings.mode === 'dual' ? [p1, p2] : [p1];
  for (const dc of drsCars) {
    let drsText = '';
    let drsColor = '';
    if (dc.drsActive) {
      drsText = `[DRS ${dc.drsTimer.toFixed(1)}s]`;
      drsColor = '#00ff44';
    } else if (dc.drsCooldown > 0) {
      drsText = `[DRS CD ${dc.drsCooldown.toFixed(1)}s]`;
      drsColor = '#ff4444';
    } else {
      const dn = nearestTrackPoint(dc.x, dc.y);
      if (speedProfile[dn.idx] > DRS_STRAIGHT_THRESHOLD) {
        drsText = '[DRS]';
        drsColor = dc.lastLapClean ? '#00ddff' : '#ffcc00';
      }
    }
    if (drsText) {
      const drsY = 100;
      if (gameSettings.mode === 'dual' && dualSplit) {
        ctx.fillStyle = drsColor; ctx.font = 'bold 10px "Courier New",monospace'; ctx.textAlign = 'center';
        ctx.fillText(drsText, dc === p1 ? 83 : W - 83, drsY);
      } else if (dc === p1) {
        ctx.fillStyle = drsColor; ctx.font = 'bold 10px "Courier New",monospace'; ctx.textAlign = 'center';
        ctx.fillText(drsText, 83, drsY);
      }
    }
  }

  // ---- Clean lap badge ----
  for (const cc of drsCars) {
    if (cc.lastLapClean) {
      const cleanY = 112;
      if (gameSettings.mode === 'dual' && dualSplit) {
        ctx.fillStyle = '#00ff88'; ctx.font = 'bold 9px "Courier New",monospace'; ctx.textAlign = 'center';
        ctx.fillText('[干净圈]', cc === p1 ? 83 : W - 83, cleanY);
      } else if (cc === p1) {
        ctx.fillStyle = '#00ff88'; ctx.font = 'bold 9px "Courier New",monospace'; ctx.textAlign = 'center';
        ctx.fillText('[干净圈]', 83, cleanY);
      }
    }
  }

  // Camera focus indicator (not shown in split-screen dual mode)
  if (!dualSplit) {
    roundRect(ctx, W-120, infoY+32, 104, 26, 4); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fill();
    ctx.fillStyle = '#ffaa44'; ctx.font = 'bold 11px "Courier New",monospace'; ctx.textAlign = 'center';
    ctx.fillText(`焦点: ${getFocusLabel(focusTarget)}`, W-68, infoY+50);
  }

  // Controls hint
  const hintY = H - 165;
  if (gameSettings.mode === 'single') {
    roundRect(ctx, W-175, hintY, 155, 50, 5); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
    ctx.fillStyle = '#666'; ctx.font = '10px "Courier New",monospace'; ctx.textAlign = 'left';
    ['↑ 加速','↓ 刹车','← → 转向'].forEach((t,i) => ctx.fillText(t, W-165, hintY+18+i*19));
  } else {
    roundRect(ctx, W-175, hintY, 155, 90, 5); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
    ctx.fillStyle = '#cc0000'; ctx.font = 'bold 10px "Courier New",monospace'; ctx.textAlign = 'left';
    ctx.fillText('P1 方向键', W-165, hintY+16);
    ctx.fillStyle = '#666'; ctx.font = '10px "Courier New",monospace';
    ['↑ 加速','↓ 刹车','← → 转向'].forEach((t,i) => ctx.fillText(t, W-155, hintY+32+i*19));
    ctx.fillStyle = '#0055ff'; ctx.font = 'bold 10px "Courier New",monospace';
    ctx.fillText('P2 WASD', W-165, hintY+82);
    ctx.fillStyle = '#666'; ctx.font = '10px "Courier New",monospace';
    ['W 加速','S 刹车','A D 转向'].forEach((t,i) => ctx.fillText(t, W-155, hintY+98+i*19));
  }

  // ---- Phase overlays ----
  if (race.phase === 'IDLE') {
    ctx.fillStyle = 'rgba(255,255,0,0.08)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 32px "Courier New",monospace'; ctx.textAlign = 'center';
    ctx.fillText('点击「开始比赛」', W/2, H/2 - 10);
    const modeText = gameSettings.mode === 'dual' ? `双人模式  ·  ${gameSettings.aiCount} AI` : `${gameSettings.aiCount} AI`;
    ctx.fillStyle = '#888'; ctx.font = '14px "Courier New",monospace';
    ctx.fillText(`${modeText}  ·  共 ${raceLaps} 圈`, W/2, H/2 + 30);
  }

  if (race.phase === 'FINISHED') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);

    // Determine winner
    const winner = race.winner || ranked[0];
    const wLabel = getCarLabel(winner);
    const wColor = winner === p1 ? '#ffcc00' : winner === p2 ? '#66bbff' : winner === a1 ? '#00d2be' : '#ff8800';

    ctx.fillStyle = wColor; ctx.font = 'bold 40px "Courier New",monospace'; ctx.textAlign = 'center';
    ctx.fillText(`${wLabel} 获胜！`, W/2, H/2 - 50);

    // Show ranking
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px "Courier New",monospace';
    let rankText = '';
    for (let i = 0; i < ranked.length; i++) {
      const c = ranked[i];
      rankText += `P${i+1} ${getCarLabel(c)} ${c.lapCount}圈${i < ranked.length - 1 ? '  ' : ''}`;
    }
    ctx.fillText(rankText, W/2, H/2);

    ctx.fillStyle = '#888'; ctx.font = '14px "Courier New",monospace';
    ctx.fillText(`总用时 ${fmtTime(race.elapsedTime)}`, W/2, H/2 + 40);
    ctx.fillStyle = '#666'; ctx.font = '12px "Courier New",monospace';
    ctx.fillText('点击「重置」重新开始', W/2, H/2 + 75);
  }
}

function renderView(ox, oy, vw, vh, camObj, zoomVal, camPlayer) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(ox, oy, vw, vh);
  ctx.clip();

  ctx.setTransform(zoomVal, 0, 0, zoomVal, -camObj.x * zoomVal + ox, -camObj.y * zoomVal + oy);

  drawGrass();
  drawTireMarks();
  drawTrack();
  drawBrakeMarks();
  drawSparksFx();

  for (const c of getActiveCars()) {
    drawWake(c);
    drawSlipstream(c);
    drawDRS(c);
    drawCar(c.x, c.y, c.heading, c);
  }

  for (const c of getActiveCars()) {
    drawSpeedLines(c.x, c.y, c.heading, c.speed);
  }

  if (camPlayer && !camPlayer.onTrack) {
    ctx.fillStyle = camPlayer === p1 ? 'rgba(255,80,0,0.06)' : 'rgba(0,80,255,0.06)';
    ctx.fillRect(camObj.x, camObj.y, vw / zoomVal, vh / zoomVal);
  }

  ctx.restore();
}

function drawViewDivider() {
  ctx.save();

}

// ============================================================
// MINIMAP
// ============================================================
function drawMinimap() {
  const mw = 160, mh = 120;
  const mx = W - mw - 14, my = H - mh - 14 - 90;
  const hw = CFG.trackWidth / 2;
  const b = trackBounds;
  const bw = b.maxX - b.minX, bh = b.maxY - b.minY;
  const scaleX = mw / bw, scaleY = mh / bh;

  // Background panel
  roundRect(ctx, mx - 6, my - 6, mw + 12, mh + 12, 5);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fill();

  // Track area (filled between outer and inner edges)
  ctx.beginPath();
  for (let i = 0; i < track.length; i++) {
    const p = track[i];
    const sx = mx + (p.x + p.nx * hw - b.minX) * scaleX;
    const sy = my + (p.y + p.ny * hw - b.minY) * scaleY;
    i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
  }
  for (let i = track.length - 1; i >= 0; i--) {
    const p = track[i];
    const sx = mx + (p.x - p.nx * hw - b.minX) * scaleX;
    const sy = my + (p.y - p.ny * hw - b.minY) * scaleY;
    ctx.lineTo(sx, sy);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(60,60,60,0.45)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Center line
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  for (let i = 0; i < track.length; i++) {
    const sx = mx + (track[i].x - b.minX) * scaleX;
    const sy = my + (track[i].y - b.minY) * scaleY;
    i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
  }
  ctx.closePath();
  ctx.stroke();

  // Car position dots (body color + accent to match livery)
  for (const c of getActiveCars()) {
    const sx = mx + (c.x - b.minX) * scaleX;
    const sy = my + (c.y - b.minY) * scaleY;
    const isHuman = c === p1 || (gameSettings.mode === 'dual' && c === p2);
    // Outer ring: body color
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
    ctx.fill();
    // White border for human players, subtle for AI
    ctx.strokeStyle = isHuman ? '#fff' : 'rgba(0,0,0,0.4)';
    ctx.lineWidth = isHuman ? 2 : 1;
    ctx.stroke();
    // Inner dot: accent color
    ctx.fillStyle = c.accent;
    ctx.beginPath();
    ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ============================================================
// SLIPSTREAM / DRAFTING
// ============================================================
function updateSlipstream(car, dt) {
  const SLIP_DIST = 250;   // max distance to benefit from slipstream (px, ~3 car lengths)
  const SLIP_ANGLE = 0.5; // max heading difference (radians)
  const BOOST_SPEED = 45; // extra max speed when charged
  const CHARGE_TIME = 0.5; // seconds needed to charge boost

  car.slipstreamTimer = car.slipstreamTimer || 0;
  car.slipStreamBoost = car.slipStreamBoost || 0;

  let inSlip = false;
  for (const other of getActiveCars()) {
    if (other === car || other.blocked) continue;

    const dx = other.x - car.x, dy = other.y - car.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > SLIP_DIST) continue;

    // Other car must be ahead in car's heading direction
    const dot = Math.sin(car.heading) * dx - Math.cos(car.heading) * dy;
    if (dot < 0) continue;

    // Heading must be roughly aligned
    let hd = other.heading - car.heading;
    while (hd > Math.PI) hd -= 2 * Math.PI;
    while (hd < -Math.PI) hd += 2 * Math.PI;
    if (Math.abs(hd) > SLIP_ANGLE) continue;

    inSlip = true;
    break;
  }

  if (inSlip) {
    car.slipstreamTimer = Math.min(car.slipstreamTimer + dt, 3.0);
    if (car.slipstreamTimer >= CHARGE_TIME) {
      car.slipStreamBoost = BOOST_SPEED;
    }
  } else {
    // Fast decay when not in slipstream
    car.slipstreamTimer = Math.max(0, car.slipstreamTimer - dt * 2);
    if (car.slipstreamTimer < CHARGE_TIME) {
      car.slipStreamBoost = 0;
    }
  }
}

// ============================================================
// TRACK SELECTOR — full-screen overlay with minimap previews
// ============================================================
function renderTrackSelector() {
  // Dim overlay
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);

  const cols = TRACKS_PER_PAGE, cardW = 260, cardH = 270, gap = 30;
  const totalW = cols * cardW + (cols-1) * gap;
  const ox = (W - totalW) / 2, oy = (H - cardH) / 2;
  const totalPages = Math.ceil(TRACK_PREVIEWS.length / TRACKS_PER_PAGE);
  const offset = trackSelectorPage * TRACKS_PER_PAGE;

  // Title
  ctx.fillStyle = '#fff'; ctx.font = 'bold 26px "Courier New",monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('选择赛道', W/2, oy - 16);

  // Page indicator
  ctx.fillStyle = '#888'; ctx.font = '14px "Courier New",monospace'; ctx.textAlign = 'center';
  ctx.fillText(`第 ${trackSelectorPage+1}/${totalPages} 页`, W/2, oy + cardH + 28);

  // Prev arrow
  if (trackSelectorPage > 0) {
    const arrX = ox - 60, arrY = oy + cardH/2 - 25, arrS = 50;
    const hover = mouseX >= arrX && mouseX <= arrX + arrS && mouseY >= arrY && mouseY <= arrY + arrS;
    ctx.fillStyle = hover ? '#ffcc00' : 'rgba(255,255,255,0.4)';
    ctx.font = 'bold 40px "Courier New",monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('◀', arrX + arrS/2, arrY + arrS/2);
  }

  // Next arrow
  if (trackSelectorPage < totalPages - 1) {
    const arrX = ox + totalW + 10, arrY = oy + cardH/2 - 25, arrS = 50;
    const hover = mouseX >= arrX && mouseX <= arrX + arrS && mouseY >= arrY && mouseY <= arrY + arrS;
    ctx.fillStyle = hover ? '#ffcc00' : 'rgba(255,255,255,0.4)';
    ctx.font = 'bold 40px "Courier New",monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('▶', arrX + arrS/2, arrY + arrS/2);
  }

  for (let i = 0; i < cols && offset + i < TRACK_PREVIEWS.length; i++) {
    const idx = offset + i;
    const cx = ox + i * (cardW + gap), cy = oy;
    const hover = mouseX >= cx && mouseX <= cx + cardW && mouseY >= cy && mouseY <= cy + cardH;

    // Card bg
    roundRect(ctx, cx, cy, cardW, cardH, 10);
    ctx.fillStyle = hover ? 'rgba(50,50,80,0.95)' : 'rgba(30,30,50,0.9)';
    ctx.fill();
    ctx.strokeStyle = hover ? '#ffcc00' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = hover ? 2.5 : 1.5;
    ctx.stroke();
    if (idx === currentTrackIdx) {
      ctx.strokeStyle = '#44ff44'; ctx.lineWidth = 2;
      ctx.setLineDash([5,4]); ctx.strokeRect(cx+4, cy+4, cardW-8, cardH-8);
      ctx.setLineDash([]);
    }

    // Minimap area
    const td = TRACK_PREVIEWS[idx];
    const b = td.bounds, bw = b.maxX - b.minX, bh = b.maxY - b.minY;
    const mw = cardW - 40, mh = cardH - 90;
    const scale = Math.min(mw / bw, mh / bh);
    const mmW = bw * scale, mmH = bh * scale;
    const mmX = cx + (cardW - mmW)/2, mmY = cy + 16;
    const hw = 110;

    // Track surface
    ctx.beginPath();
    for (let j = 0; j < td.previewPts.length; j++) {
      const p = td.previewPts[j];
      const sx = mmX + (p.x + p.nx * hw - b.minX) * scale;
      const sy = mmY + (p.y + p.ny * hw - b.minY) * scale;
      j === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
    }
    for (let j = td.previewPts.length - 1; j >= 0; j--) {
      const p = td.previewPts[j];
      const sx = mmX + (p.x - p.nx * hw - b.minX) * scale;
      const sy = mmY + (p.y - p.ny * hw - b.minY) * scale;
      ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(60,60,60,0.85)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.stroke();

    // Center line
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.5;
    ctx.beginPath();
    for (let j = 0; j < td.previewPts.length; j++) {
      const p = td.previewPts[j];
      const sx = mmX + (p.x - b.minX) * scale, sy = mmY + (p.y - b.minY) * scale;
      j === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
    }
    ctx.closePath(); ctx.stroke();

    // Track name
    ctx.fillStyle = hover ? '#ffcc00' : '#ccc';
    ctx.font = 'bold 16px "Courier New",monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(td.label, cx + cardW/2, cy + cardH - 16);
  }
}

// MAIN LOOP
// ============================================================
let lastTime = 0;

function gameLoop(time) {
  try {
    const dt = lastTime ? (time - lastTime) / 1000 : 0.016;
    lastTime = time;

    if (!showTrackSelector) {
      updateCountdown(dt);
      if (race.phase === 'RACING') race.elapsedTime += dt;

    // Update all players
    updatePlayer(p1, dt);
    if (gameSettings.mode === 'dual') updatePlayer(p2, dt);

    // Update all AI
    if (gameSettings.aiCount >= 1) updateAI(a1, dt);
    if (gameSettings.aiCount >= 2) updateAI(a2, dt);

    // Slipstream / drafting
    for (const c of getActiveCars()) { if (!c.blocked) updateSlipstream(c, dt); }

    // Collisions
    if (race.phase === 'RACING') checkCollisions();
    updateSparks(dt);

    // Off-track respawn: 1 second off track → return to nearest track point
    if (race.phase === 'RACING' || race.phase === 'COUNTDOWN') {
      for (const c of getActiveCars()) {
        const n = nearestTrackPoint(c.x, c.y);
        if (n.dist > CFG.trackWidth * 0.55) {
          c.hadOfftrack = true;
          c.offTrackTimer += dt;
          if (c.offTrackTimer > 1.0) {
            c.x = n.point.x; c.y = n.point.y;
            c.heading = Math.atan2(n.point.tx, -n.point.ty);
            c.speed = 50;
            if (c.trackIdx !== undefined) { c.trackIdx = n.idx; c.errDrift = 0; c.errTimer = 0; c.prevSpeed = 0; }
            c._prevIdx = n.idx;
            // If car had already wrapped but respawns past finish line, count the lap immediately
            if (c._hasWrapped && n.idx >= finishIdx && c.lapCooldown <= 0) {
              c.lastLapClean = !c.hadOfftrack && !c.hadCollision;
              c.hadOfftrack = false; c.hadCollision = false;
              c.lapCount++;
              c.lapCooldown = 1.5;
              c.lapTime = race.elapsedTime - c.lapStartTime;
              c.lapStartTime = race.elapsedTime;
              c._hasWrapped = false;
            }
            c.offTrackTimer = 0;
          }
        } else {
          c.offTrackTimer = 0;
        }
      }
    }

    // === Finish-line lap detection (all cars) ===
    if (race.phase === 'RACING') {
      for (const c of getActiveCars()) {
        const n = nearestTrackPoint(c.x, c.y);
        if (n.dist < CFG.trackWidth * 0.5 && c.speed > 30) {
          // Detect wrap-around: car went from near the track end to near the start
          if (c._prevIdx > track.length * 0.7 && n.idx < track.length * 0.3) {
            c._hasWrapped = true;
          }
          // Lap counted when car crosses finishIdx after wrapping around
          if (c._hasWrapped && n.idx > c._prevIdx && c._prevIdx < finishIdx && n.idx >= finishIdx && c.lapCooldown <= 0) {
            c.lastLapClean = !c.hadOfftrack && !c.hadCollision;
            c.hadOfftrack = false; c.hadCollision = false;
            c.lapCount++;
            c.lapCooldown = 1.5;
            c.lapTime = race.elapsedTime - c.lapStartTime;
            c.lapStartTime = race.elapsedTime;
            c._hasWrapped = false;
          }
          c._prevIdx = n.idx;
        }
      }
    }

    // Check finish condition (must run AFTER lap detection)
    if (race.phase === 'RACING') {
      for (const c of getActiveCars()) {
        if (c.lapCount >= raceLaps) {
          race.phase = 'FINISHED';
          race.winner = c;
          for (const cc of getActiveCars()) cc.blocked = true;
          break;
        }
      }
    }

    // Brake marks — two rear tire tracks
    updateBrakeMarks(dt);
    for (const c of getActiveCars()) {
      if (c.braking && c.speed > 50 && c.onTrack) {
        const sinH = Math.sin(c.heading), cosH = Math.cos(c.heading);
        // Left rear tire position
        const lx = c.x - sinH * 15 - cosH * 12;
        const ly = c.y + cosH * 15 - sinH * 12;
        // Right rear tire position
        const rx = c.x - sinH * 15 + cosH * 12;
        const ry = c.y + cosH * 15 + sinH * 12;
        // Left tire spacing check
        const dLx = lx - (c._brakeLX || -Infinity);
        const dLy = ly - (c._brakeLY || -Infinity);
        if (dLx * dLx + dLy * dLy > 225) {
          addBrakeMark(lx, ly);
          c._brakeLX = lx; c._brakeLY = ly;
        }
        // Right tire spacing check
        const dRx = rx - (c._brakeRX || -Infinity);
        const dRy = ry - (c._brakeRY || -Infinity);
        if (dRx * dRx + dRy * dRy > 225) {
          addBrakeMark(rx, ry);
          c._brakeRX = rx; c._brakeRY = ry;
        }
      } else {
        c._brakeLX = c._brakeLY = c._brakeRX = c._brakeRY = undefined;
      }
    }
    }

    // Camera and render
    if (gameSettings.mode === 'dual' && dualSplit) {
      const tx1 = p1.x - (W / 4) / ZOOM, ty1 = p1.y - H / (2 * ZOOM);
      cam.x += (tx1 - cam.x) * 0.09; cam.y += (ty1 - cam.y) * 0.09;
      const tx2 = p2.x - (W / 4) / ZOOM, ty2 = p2.y - H / (2 * ZOOM);
      cam2.x += (tx2 - cam2.x) * 0.09; cam2.y += (ty2 - cam2.y) * 0.09;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, W, H);

      renderView(0, 0, W / 2, H, cam, ZOOM, p1);
      renderView(W / 2, 0, W / 2, H, cam2, ZOOM, p2);
      drawViewDivider();
    } else {
      // Single camera update with dynamic zoom
      let mx, my;
      let targetZoom = ZOOM;
      if (focusTarget) {
        mx = focusTarget.x; my = focusTarget.y;
      } else {
        const cars = getActiveCars();
        mx = 0; my = 0;
        for (const c of cars) { mx += c.x; my += c.y; }
        mx /= cars.length; my /= cars.length;
        if (cars.length > 1) {
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          for (const c of cars) {
            if (c.x < minX) minX = c.x;
            if (c.x > maxX) maxX = c.x;
            if (c.y < minY) minY = c.y;
            if (c.y > maxY) maxY = c.y;
          }
          const bboxW = maxX - minX, bboxH = maxY - minY;
          const pad = 0.2;
          if (bboxW > 5) targetZoom = Math.min(targetZoom, W * (1 - 2 * pad) / bboxW);
          if (bboxH > 5) targetZoom = Math.min(targetZoom, H * (1 - 2 * pad) / bboxH);
          targetZoom = Math.max(targetZoom, 0.15);
        }
      }
      smoothTargetZoom += (targetZoom - smoothTargetZoom) * 0.05;
      currentZoom += (smoothTargetZoom - currentZoom) * 0.10;
      const tx = mx - W / (2 * currentZoom), ty = my - H / (2 * currentZoom);
      cam.x += (tx - cam.x) * 0.09;
      cam.y += (ty - cam.y) * 0.09;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, W, H);

      renderView(0, 0, W, H, cam, currentZoom, null);
    }

    // ---- Render screen space ----
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawHUD();
    drawCountdownLights();
    drawMinimap();

    if (showTrackSelector) renderTrackSelector();

  } catch (e) {
    console.error('Game error:', e);
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================
// CONTROLS
// ============================================================
window.__k1 = {}; // Player 1 — Arrow keys + Alt (DRS)
window.__k2 = {}; // Player 2 — WASD + Space (DRS/brake)
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) { e.preventDefault(); window.__k1[e.key] = true; }
  if (['w','W','a','A','s','S','d','D'].includes(e.key)) { e.preventDefault(); window.__k2[e.key.toLowerCase()] = true; }
  // DRS / brake keys
  if (e.key === 'Alt') { e.preventDefault(); window.__k1.Alt = true; }
  if (e.key === ' ') { e.preventDefault(); window.__k2[' '] = true; }
});
window.addEventListener('keyup', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) { e.preventDefault(); window.__k1[e.key] = false; }
  if (['w','W','a','A','s','S','d','D'].includes(e.key)) { e.preventDefault(); window.__k2[e.key.toLowerCase()] = false; }
  // DRS / brake keys
  if (e.key === 'Alt') { e.preventDefault(); window.__k1.Alt = false; }
  if (e.key === ' ') { e.preventDefault(); window.__k2[' '] = false; }
});

// ============================================================
// BUTTONS
// ============================================================
document.getElementById('btnStart').addEventListener('click', () => { startCountdown(); });
document.getElementById('btnStop').addEventListener('click', () => {
  for (const c of getActiveCars()) c.speed = 0;
});
document.getElementById('btnReset').addEventListener('click', () => {
  initPositions();
  race.phase = 'IDLE'; race.elapsedTime = 0; race.winner = null;
  race.lightsOn = 0; race.countTimer = 0; race.countStep = 0;
  if (focusTarget) { cam.x = focusTarget.x - W/(2*ZOOM); cam.y = focusTarget.y - H/(2*ZOOM); currentZoom = ZOOM; }
  else {
    const cars = getActiveCars();
    let mx = 0, my = 0;
    for (const c of cars) { mx += c.x; my += c.y; }
    mx /= cars.length; my /= cars.length;
    cam.x = mx - W/(2*ZOOM); cam.y = my - H/(2*ZOOM); currentZoom = ZOOM;
  }
  cam2.x = p2.x - W/(4*ZOOM); cam2.y = p2.y - H/(2*ZOOM);
});

document.getElementById('btnDifficulty').addEventListener('click', () => {
  if (race.phase !== 'IDLE') return;
  const order = [DIFFICULTY.EASY, DIFFICULTY.MEDIUM, DIFFICULTY.HARD, DIFFICULTY.SUPER_HARD, DIFFICULTY.HELL, DIFFICULTY.BOSS];
  let idx = order.indexOf(currentDifficulty);
  currentDifficulty = order[(idx + 1) % order.length];
  document.getElementById('btnDifficulty').textContent = currentDifficulty.label;
});

document.getElementById('btnMode').addEventListener('click', () => {
  if (race.phase !== 'IDLE') return;
  gameSettings.mode = gameSettings.mode === 'single' ? 'dual' : 'single';
  document.getElementById('btnMode').textContent = gameSettings.mode === 'dual' ? '双人' : '单人';
  document.getElementById('btnCamFocus').textContent = '焦点: ' + getFocusLabel(focusTarget);
  initPositions();
  race.phase = 'IDLE'; race.elapsedTime = 0; race.winner = null;
  if (focusTarget && getActiveCars().indexOf(focusTarget) === -1) focusTarget = null;
  if (focusTarget) { cam.x = focusTarget.x - W/(2*ZOOM); cam.y = focusTarget.y - H/(2*ZOOM); currentZoom = ZOOM; }
  else {
    const cars = getActiveCars();
    let mx = 0, my = 0;
    for (const c of cars) { mx += c.x; my += c.y; }
    mx /= cars.length; my /= cars.length;
    cam.x = mx - W/(2*ZOOM); cam.y = my - H/(2*ZOOM); currentZoom = ZOOM;
  }
  cam2.x = p2.x - W/(4*ZOOM); cam2.y = p2.y - H/(2*ZOOM);
});

document.getElementById('btnAI').addEventListener('click', () => {
  if (race.phase !== 'IDLE') return;
  gameSettings.aiCount = (gameSettings.aiCount + 1) % 3;
  document.getElementById('btnAI').textContent = 'AI: ' + gameSettings.aiCount;
  initPositions();
  race.phase = 'IDLE'; race.elapsedTime = 0; race.winner = null;
  if (focusTarget && getActiveCars().indexOf(focusTarget) === -1) focusTarget = null;
  if (focusTarget) { cam.x = focusTarget.x - W/(2*ZOOM); cam.y = focusTarget.y - H/(2*ZOOM); currentZoom = ZOOM; }
  else {
    const cars = getActiveCars();
    let mx = 0, my = 0;
    for (const c of cars) { mx += c.x; my += c.y; }
    mx /= cars.length; my /= cars.length;
    cam.x = mx - W/(2*ZOOM); cam.y = my - H/(2*ZOOM); currentZoom = ZOOM;
  }
  cam2.x = p2.x - W/(4*ZOOM); cam2.y = p2.y - H/(2*ZOOM);
});

document.getElementById('btnCamFocus').addEventListener('click', () => { cycleFocus(); });

document.getElementById('btnLaps').addEventListener('click', () => {
  if (race.phase === 'RACING' || race.phase === 'COUNTDOWN') return;
  lapOptIdx = (lapOptIdx + 1) % LAP_OPTIONS.length;
  raceLaps = LAP_OPTIONS[lapOptIdx];
  document.getElementById('btnLaps').textContent = '圈数: ' + raceLaps;
});

document.getElementById('btnTrack').addEventListener('click', () => {
  if (race.phase === 'RACING' || race.phase === 'COUNTDOWN') return;
  showTrackSelector = !showTrackSelector;
});

// ============================================================
// START
// ============================================================
gameLoop(0);
</script>
